{% extends "base.html" %}
{% block title %}Login - ResumeAI{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg auth-card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="auth-icon mx-auto mb-3"><i class="fas fa-brain fa-2x text-warning"></i></div>
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p class="text-muted">Sign in to your ResumeAI account</p>
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Your password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-bold">Register here</a></p>
                    </div>
                    <hr>
                    <div class="small text-muted text-center">
                        <strong>Demo:</strong> recruiter@demo.com / demo123
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
