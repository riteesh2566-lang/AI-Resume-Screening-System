{% extends "base.html" %}
{% block title %}Register - ResumeAI{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg auth-card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="auth-icon mx-auto mb-3"><i class="fas fa-user-plus fa-2x text-warning"></i></div>
                        <h3 class="fw-bold">Create Account</h3>
                        <p class="text-muted">Join ResumeAI and get AI-powered career insights</p>
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Account Type</label>
                            <div class="d-flex gap-3">
                                <div class="form-check role-card flex-fill p-3 border rounded" id="candidateCard">
                                    <input class="form-check-input" type="radio" name="role" id="roleCandidate" value="candidate" checked>
                                    <label class="form-check-label w-100" for="roleCandidate">
                                        <i class="fas fa-user text-primary me-2"></i><strong>Candidate</strong>
                                        <div class="small text-muted">Upload &amp; analyze your resume</div>
                                    </label>
                                </div>
                                <div class="form-check role-card flex-fill p-3 border rounded" id="recruiterCard">
                                    <input class="form-check-input" type="radio" name="role" id="roleRecruiter" value="recruiter">
                                    <label class="form-check-label w-100" for="roleRecruiter">
                                        <i class="fas fa-user-tie text-success me-2"></i><strong>Recruiter</strong>
                                        <div class="small text-muted">Post jobs &amp; screen candidates</div>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">
                            <i class="fas fa-user-plus me-2"></i>Create Account
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-bold">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
